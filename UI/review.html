<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Slide review · PDF → Structured JSON</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%23f5a623"/><text x="16" y="22" font-size="17" text-anchor="middle" font-family="monospace" fill="%231c1917">{}</text></svg>' />
<style>
:root {
  --bg: #141414; --panel: rgba(26, 26, 26, 0.78); --panel-solid: #1c1c1c;
  --border: rgba(255, 255, 255, 0.09); --border-strong: rgba(255, 255, 255, 0.16);
  --text: #e8e6e3; --muted: #8d8b88; --faint: #5c5a57;
  --amber: #f5a623; --amber-soft: rgba(245, 166, 35, 0.14);
  --green: #34d399; --red: #f87171; --mono: "SFMono-Regular", "JetBrains Mono", ui-monospace, Menlo, monospace;
}
.skipped-toggle { background: transparent; border: 1px dashed var(--border-strong); border-radius: 8px; color: var(--muted); font-size: 0.75rem; padding: 8px 10px; text-align: left; width: 100%; }
.skipped-toggle:hover { color: var(--amber); border-color: var(--amber); }
.read-only-slide { opacity: 0.55; }
.read-only-slide:hover { opacity: 0.85; }
.queue-badge { font-family: var(--mono); font-size: 0.6rem; padding: 1px 5px; border-radius: 4px; background: var(--amber-soft); color: var(--amber); text-transform: uppercase; }
.approved-badge { font-family: var(--mono); font-size: 0.6rem; padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(52, 211, 153, 0.4); color: var(--green); text-transform: uppercase; }
.lock-note { font-size: 0.7rem; color: var(--muted); font-family: var(--mono); margin-left: 8px; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
button { font: inherit; cursor: pointer; }
header.topbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--panel); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 5; }
.back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
.back:hover { color: var(--text); }
.file-name { font-weight: 650; }
.chip { font-family: var(--mono); font-size: 0.72rem; padding: 3px 8px; border: 1px solid var(--border-strong); border-radius: 6px; color: var(--muted); }
.chip b { color: var(--text); }
.pill { font-family: var(--mono); font-size: 0.72rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border-strong); }
.pill.review { color: var(--amber); border-color: rgba(245,166,35,.4); background: var(--amber-soft); }
.pill.failed { color: var(--red); border-color: rgba(248,113,113,.4); }
.pill.done { color: var(--green); border-color: rgba(52,211,153,.4); }
.jobbar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: transparent; }
.jobbar-fill { height: 100%; width: 0%; background: var(--amber); transition: width .4s ease; }
.jobbar.indeterminate .jobbar-fill { width: 35%; animation: jobbar-slide 1.2s ease-in-out infinite; }
@keyframes jobbar-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
.spacer { flex: 1; }
.nav-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border-strong); background: transparent; color: var(--text); }
.nav-btn:hover { border-color: var(--amber); color: var(--amber); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
main.layout { display: grid; grid-template-columns: 220px 1fr 430px; height: calc(100vh - 54px); }
@media (max-width: 1150px) { main.layout { grid-template-columns: 1fr; height: auto; } }
.rail { border-right: 1px solid var(--border); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.slide-item { display: flex; gap: 10px; align-items: center; padding: 7px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--text); text-align: left; }
.slide-item:hover { background: rgba(255,255,255,.04); }
.slide-item.active { border-color: var(--amber); background: var(--amber-soft); }
.slide-item img { width: 72px; height: 44px; object-fit: cover; object-position: top center; border-radius: 4px; border: 1px solid var(--border); background: #222; }
.si-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.si-num { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-family: var(--mono); font-size: 0.6rem; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--muted); text-transform: uppercase; }
.badge.failed { color: var(--red); border-color: rgba(248,113,113,.5); }
.badge.low { color: var(--amber); border-color: rgba(245,166,35,.5); }
.badge.issues { color: #fca5a5; border-color: rgba(248,113,113,.35); }
.badge.reviewed { color: var(--green); border-color: rgba(52,211,153,.4); }
section.viewer { overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 14px; gap: 10px; background: #101010; }
.img-wrap { position: relative; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: #000; max-width: 100%; line-height: 0; }
#slideImage { display: block; max-width: 100%; height: auto; }
#bboxOverlay { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; }
#bboxOverlay .fig { cursor: pointer; fill: rgba(245, 166, 35, 0.08); stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 4 3; }
#bboxOverlay .fig.c0 { stroke: var(--amber); fill: rgba(245, 166, 35, 0.10); }
#bboxOverlay .fig.c1 { stroke: #34d399; fill: rgba(52, 211, 153, 0.10); }
#bboxOverlay .fig.c2 { stroke: #818cf8; fill: rgba(129, 140, 248, 0.10); }
#bboxOverlay .fig.c3 { stroke: #f472b6; fill: rgba(244, 114, 182, 0.10); }
#bboxOverlay .fig.c4 { stroke: #a3e635; fill: rgba(163, 230, 53, 0.10); }
#bboxOverlay .fig.c5 { stroke: #38bdf8; fill: rgba(56, 189, 248, 0.10); }
#bboxOverlay .fig.sel { fill: rgba(245, 166, 35, 0.18); stroke-width: 2.2; }
#bboxOverlay text.figtag { fill: var(--amber); font-family: var(--mono); font-size: 11px; paint-order: stroke; stroke: #141414; stroke-width: 3px; pointer-events: none; }
#bboxOverlay .handle { fill: var(--amber); stroke: #141414; stroke-width: 1.4; cursor: crosshair; }
#bboxOverlay.drawing { cursor: crosshair; }
#bboxOverlay .draft { stroke: var(--green); fill: rgba(52, 211, 153, 0.15); stroke-width: 1.5; }
.tool-row { display: flex; gap: 8px; align-items: center; color: var(--muted); font-family: var(--mono); font-size: 0.72rem; flex-wrap: wrap; }
.tool-row button { min-width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border-strong); background: transparent; color: var(--text); padding: 0 6px; }
.tool-row button:hover { border-color: var(--amber); color: var(--amber); }
.tool-row button.active { border-color: var(--green); color: var(--green); }
.editor { border-left: 1px solid var(--border); display: grid; grid-template-rows: auto 1fr auto auto; background: var(--panel-solid); min-height: 0; }
.editor-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 6px; border-bottom: 1px solid var(--border); }
.editor-head h2 { margin: 0; font-size: 0.85rem; font-weight: 650; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
#jsonValid { font-family: var(--mono); font-size: 0.68rem; color: var(--green); }
#jsonValid.bad { color: var(--red); }
#jsonEditor { width: 100%; height: 100%; min-height: 200px; resize: none; border: 0; outline: none; background: #101010; color: var(--text); font-family: var(--mono); font-size: 12.5px; line-height: 1.55; padding: 12px 14px; white-space: pre; overflow: auto; }
.figure-bar { max-height: 190px; overflow-y: auto; border-top: 1px solid var(--border); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.figure-bar:empty { display: none; }
.grounding { border-top: 1px solid var(--border); padding: 8px 10px 10px; max-height: 190px; overflow-y: auto; font-family: var(--mono); font-size: 0.68rem; }
.grounding[hidden] { display: none; }
.grounding .g-head { display: flex; align-items: center; gap: 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
.grounding .g-text { color: var(--text); line-height: 1.5; margin-bottom: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.grounding .g-evidence { display: flex; flex-wrap: wrap; gap: 4px; }
.grounding .g-chip { border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 5px; color: var(--amber); background: var(--amber-soft); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help; }
.grounding .g-flag { border: 1px solid rgba(248,113,113,.4); color: var(--red); border-radius: 4px; padding: 1px 5px; cursor: help; }
.grounding .g-ok { color: var(--green); }
.fig-row { display: grid; grid-template-columns: 108px 44px 1fr auto; gap: 6px; align-items: center; font-size: 0.78rem; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
.fig-row.excluded { opacity: 0.45; }
.fig-row.active { border-color: var(--amber); }
.fig-row .ft { font-family: var(--mono); font-size: 0.62rem; color: var(--amber); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fig-row .ft b { color: var(--text); text-transform: none; display: block; }
.fig-note { font-family: var(--mono); font-size: 0.58rem; color: #fca5a5; border: 1px solid rgba(248,113,113,.35); border-radius: 4px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; cursor: help; }
.issues-panel { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 4px; font-family: var(--mono); font-size: 0.68rem; }
.issues-panel .issue { padding: 5px 8px; border: 1px solid rgba(248,113,113,.25); border-left: 3px solid var(--red); border-radius: 6px; background: rgba(248,113,113,.06); color: #fca5a5; overflow-wrap: anywhere; white-space: pre-wrap; }
.issues-panel .issue.warn { border-color: rgba(245,166,35,.25); border-left-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
.issues-panel .issue b { text-transform: uppercase; letter-spacing: 0.06em; margin-right: 6px; }
.fig-row input[type="text"] { background: #101010; border: 1px solid var(--border-strong); color: var(--text); border-radius: 4px; padding: 3px 6px; font-size: 0.72rem; width: 100%; }
.crop { width: 44px; height: 54px; object-fit: cover; object-position: top center; border-radius: 3px; border: 1px solid var(--border-strong); background: #111; }
.fig-actions { display: flex; flex-direction: column; gap: 3px; align-items: end; }
.chk { display: flex; align-items: center; gap: 3px; font-size: 0.62rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.chk input { accent-color: var(--amber); }
.mini { font-size: 0.62rem; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-strong); background: transparent; color: var(--muted); }
.mini:hover { color: var(--amber); border-color: var(--amber); }
.missing-row { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--border); align-items: center; }
.missing-row input { flex: 1; background: #101010; color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 10px; font: inherit; }
.missing-row input::placeholder { color: var(--faint); }
.btn-row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
.btn { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: rgba(255,255,255,.04); color: var(--text); font-weight: 600; font-size: 0.83rem; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #1c1917; }
.btn.ok { background: var(--green); border-color: var(--green); color: #0d2018; }
.btn.ghost:hover { border-color: var(--amber); color: var(--amber); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.danger:hover { border-color: var(--red); color: var(--red); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #262626; border: 1px solid var(--border-strong); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; z-index: 50; opacity: 0; transition: opacity 200ms; pointer-events: none; max-width: 60vw; }
.toast.show { opacity: 1; }
.loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--muted); font-family: var(--mono); }
.hidden { display: none !important; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.25); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head><body>
<header class="topbar">
  <div class="jobbar" id="jobBar" hidden><div class="jobbar-fill" id="jobBarFill"></div></div>
  <a class="back" href="/">← back</a>
  <span class="file-name" id="fileName">loading…</span>
  <button class="nav-btn" id="prevBtn" aria-label="previous slide">‹</button>
  <span class="chip" id="slideCounter">–/–</span>
  <button class="nav-btn" id="nextBtn" aria-label="next slide">›</button>
  <span class="pill review" id="statusPill">review</span>
  <span class="spacer"></span>
  <span class="chip" id="progressChip"></span>
  <button class="btn ghost" id="translateAllBtn" type="button" title="Translate all approved slides into English">🌐 Translate all</button>
  <button class="btn ok" id="exportBtn" disabled>Export JSON</button>
</header>

<main class="layout">
  <nav class="rail" id="slideList" aria-label="Slides in review queue"></nav>
  <section class="viewer">
    <div class="img-wrap" id="imgWrap">
      <img id="slideImage" alt="Current slide" />
      <svg id="bboxOverlay" role="application" aria-label="Figure bounding boxes — drag to move, arrow keys to nudge, Delete to clear"></svg>
    </div>
    <div class="tool-row">
      <button id="zoomOut" aria-label="zoom out">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" aria-label="zoom in">+</button>
      <span style="width:8px"></span>
      <button id="overlayToggle" aria-label="toggle figure boxes">◱ boxes</button>
      <button id="drawToggle" aria-label="draw a new figure box">+ box</button>
      <button id="resetBox" aria-label="reset selected figure box">↺ reset</button>
      <button id="clearBox" aria-label="clear selected figure box">✕ box</button>
      <button id="zoomPassBtn" aria-label="zoom pass on selected figure">🔍 zoom text</button>
      <span id="slideIdLine" class="status-line"></span>
    </div>
    <div id="issuesPanel" class="issues-panel" hidden></div>
  </section>
  <aside class="editor" id="editor">
    <div class="editor-head"><h2>Slide <span id="slideNum">–</span> · <span id="slideTitle">(loading)</span><span class="lock-note" id="approvedNote"></span><span class="lock-note" id="translateNote" style="margin-left:6px"></span></h2></div>
    <div class="editor-head" style="border-top:0; border-bottom:1px solid var(--border); padding-top:0; justify-content:flex-start; gap:8px">
      <h2 style="font-size:0.7rem">JSON — figures &amp; tables only</h2>
      <span id="jsonValid" style="margin-left:auto; font-family:var(--mono); font-size:0.68rem; color:var(--green)">valid</span>
    </div>
    <textarea id="jsonEditor" spellcheck="false" aria-label="Slide figures and tables JSON"></textarea>
    <div class="figure-bar" id="figureBar"></div>
    <div class="grounding" id="groundingPanel" hidden aria-live="polite"></div>
    <div class="missing-row">
      <input type="text" id="missingInput" placeholder="What's missing on this slide? (e.g. there is a pie chart bottom-right)" aria-label="What is missing on this slide" />
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="rerunBtn" type="button">↻ Re-run figures &amp; tables</button>
      <button class="btn ghost" id="undoBtn" type="button">↶ Undo re-run</button>
      <button class="btn ghost" id="translateBtn" type="button" title="Send this slide back to the VLM: translate title/subtitle/text/notes and explain each figure in English">🌐 Translate to English</button>
      <button class="btn primary" id="approveBtn" type="button" style="margin-left:auto">Approve ✓</button>
    </div>
    <div class="btn-row" style="border-top:0; padding-top:0; justify-content:center; margin-top:-4px">
      <button class="btn ghost" id="reopenBtn" type="button" style="display:none; font-size:0.75rem">Reopen for editing</button>
    </div>
  </aside>
</main>

<div class="loading" id="boot">loading job…</div>
<div class="toast" id="toast"></div>

<script type="module">
import { summarizeSlide, badgeLabels, figureNoteLabel } from "./js/labels.js";
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); };
  const params = new URLSearchParams(location.search);
  const jobId = params.get("id") ?? "";
  const API = (p, opts = {}) => fetch("/api/jobs/" + encodeURIComponent(jobId) + p, {
    headers: { "Content-Type": "application/json" }, ...opts,
  }).then(async (r) => {
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body?.error ?? (r.status + " " + r.statusText));
    return body;
  });

  const state = {
    result: null, report: null,
    // per-slide state from the server job response
    statuses: {},     // n -> "auto" | "queued" | "approved" | "failed"
    translations: {}, // n -> { state: "translating"|"translated"|"translate_failed", ... }
    queue: [],        // queued slide numbers in order
    skipped: [],      // auto slide numbers
    view: "queue",    // "queue" | "skipped"
    current: 0,       // index into queue array
    skippedIndex: null,
    zoom: 1, overlay: true, dirty: false,
    selected: null, drawMode: false, drag: null,
    bboxSnap: null, cropStamp: 0,
  };
  const show = (sel, on) => $(sel).classList.toggle("hidden", !on);
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const round3 = (v) => Math.round(v * 1000) / 1000;
  const MIN_BOX = 0.02;
  const COLORS = ["c0", "c1", "c2", "c3", "c4", "c5"];
  const slideInQueue = () => state.queue[state.current];
  const slideInSkipped = () => state.skippedIndex != null ? state.skipped[state.skippedIndex] : null;

  // ═════════ helpers ═════════
  function figureCounts(slide) {
    return {
      figures: slide?.figures?.length ?? 0,
      tables: slide?.tables?.length ?? 0,
    };
  }
  function queuedSlides() { return state.queue.map((n) => state.result?.slides?.find((s) => s.slide === n)).filter(Boolean); }
  function skippedSlides() { return state.skipped.map((n) => state.result?.slides?.find((s) => s.slide === n)).filter(Boolean); }
  function selectedSlide() {
    if (state.view === "skipped") {
      const n = state.skippedIndex != null ? state.skipped[state.skippedIndex] : null;
      return state.result?.slides?.find((s) => s.slide === n) ?? null;
    }
    const n = state.queue[state.current];
    return state.result?.slides?.find((s) => s.slide === n) ?? null;
  }
  function currentSlideNumber() { const s = selectedSlide(); return s?.slide ?? 1; }
  function isApproved(slide) { return state.statuses[slide?.slide] === "approved"; }

  // ═════════ rail rendering ═════════
  function badgesFor(slide) {
    const b = [];
    // Descriptive badges: short text on the pill, full reason in the tooltip.
    for (const bl of badgeLabels(slide)) {
      const badge = el("span", bl.cls, bl.text);
      badge.title = bl.title;
      b.push(badge);
    }
    const status = state.statuses[slide?.slide];
    if (status === "approved") b.push(el("span", "badge reviewed", "✓ approved"));
    else if (status === "queued") b.push(el("span", "queue-badge", "queued"));
    else if (status === "failed") b.push(el("span", "badge failed", "failed"));
    return b;
  }
  function renderRail() {
    const rail = $("#slideList");
    rail.innerHTML = "";
    const q = queuedSlides();
    const order = q.map((s, i) => [s, i]).sort((a, b) => {
      const sa = badgeScore(a[0]), sb = badgeScore(b[0]);
      return sb - sa || a[0].slide - b[0].slide;
    });
    for (const [slide, i] of order) {
      const approved = state.statuses[slide.slide] === "approved";
      const counts = figureCounts(slide);
      const btn = el("button", "slide-item" + (i === state.current && state.view === "queue" ? " active" : ""));
      btn.type = "button";
      btn.setAttribute("aria-label", `Slide ${slide.slide}`);
      const img = el("img");
      img.src = `/api/jobs/${encodeURIComponent(jobId)}/slides/${slide.slide}`;
      img.alt = `Slide ${slide.slide}`;
      const meta = el("span", "si-meta");
      meta.appendChild(el("span", "si-num", `#${String(slide.slide).padStart(2, "0")} · ${counts.figures} fig${counts.tables ? ` · ${counts.tables} tbl` : ""}`));
      const badges = el("span", "badges");
      for (const b of badgesFor(slide)) badges.appendChild(b);
      meta.appendChild(badges);
      btn.append(img, meta);
      btn.addEventListener("click", () => { state.view = "queue"; state.current = i; state.skippedIndex = null; state.selected = null; renderAll(); });
      rail.appendChild(btn);
    }
    // skipped — text-only slides (toggled by the "text-only slides skipped" button)
    if (state.skipped.length > 0) {
      const toggle = el("button", "skipped-toggle", `${state.skipped.length} text-only slide${state.skipped.length === 1 ? "" : "s"} skipped${state.view === "skipped" ? " (open)" : ""}`);
      toggle.type = "button";
      toggle.addEventListener("click", () => {
        if (state.view === "skipped") { state.view = "queue"; state.skippedIndex = null; }
        else { state.view = "skipped"; state.skippedIndex = 0; state.selected = null; }
        renderAll();
      });
      rail.appendChild(toggle);
      if (state.view === "skipped") {
        for (const [idx, n] of state.skipped.entries()) {

      if (sum.low && !sum.issues.length) rows.push({ kind: "low", short: sum.low.short, detail: sum.low.detail, warn: true });

  // ═════════ image + bbox overlay ═════════
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("#bboxOverlay");

    const w = img.clientWidth, h = img.clientHeight;
    if (!w || !h) return;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const figs = s?.figures ?? [];

      if (f.excluded) return;

      if (!b) return;
      const [x0, y0, x1, y1] = b;
      const color = COLORS[i % COLORS.length];
      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", x0 * w); rect.setAttribute("y", y0 * h);
      rect.setAttribute("width", Math.max(1, (x1 - x0) * w)); rect.setAttribute("height", Math.max(1, (y1 - y0) * h));

  }
  function drawHandles(svg, w, h, b) {

  });
  svg.addEventListener("pointermove", (e) => {
    const s = selectedSlide();

    const figs = s.figures ?? [];
    const p = relBoxFromEvent(e);
    const d = state.drag;

      d.box = [Math.min(d.start.x, p.x), Math.min(d.start.y, p.y), Math.max(d.start.x, p.x), Math.max(d.start.y, p.y)];

      const r = document.createElementNS(NS, "rect");
      r.setAttribute("x", d.box[0] * w); r.setAttribute("y", d.box[1] * h);

  // ═════════ figure bar ═════════

  // ═════════ save flow ═════════
  async function saveCurrent() {
    const s = selectedSlide();
    if (!s || $("#jsonEditor").disabled) return s;
    const { parsed, ok, error } = tryParseEditor();
    if (!ok) throw new Error("invalid JSON: " + error);
    const figures = Array.isArray(parsed.figures) ? parsed.figures : [];
    const tables = Array.isArray(parsed.tables) ? parsed.tables : [];
    const savePayload = { figures, tables };
    const { slide: saved } = await API(`/slides/${s.slide}`, { method: "PUT", body: JSON.stringify(savePayload) });

    state.dirty = false;

  // Apply a GET /api/jobs/:id response to local state (including translation state).

    state.translations = data.job.translations ?? state.translations;
    state.queue = data.job.queue ?? state.queue;
    state.skipped = data.job.skipped ?? state.skipped;
    state.result = data.result ?? state.result;
  }

  async function approveCurrent() {
    // Save first, then call approve — two POST semantics to keep validations separate.
    const saved = await saveCurrent();
    if (!saved) return;
    const { slide: approved } = await API(`/slides/${saved.slide}/approve`, { method: "POST", body: JSON.stringify({ figures: saved.figures ?? [], tables: saved.tables ?? [] }) });
    if (approved) state.result.slides[state.result.slides.findIndex((x) => x.slide === approved.slide)] = approved;
    syncFromJob(await API("", {}));
    renderAll();
    // Translation runs in the background on approve — poll until it settles so the
    // review page refreshes with the English content once it lands in the manifest.
    const target = saved.slide;
    for (let i = 0; i < 40; i += 1) { // up to ~80s
      await new Promise((r) => setTimeout(r, 2000));
      try {
        const fresh = await API("", {});

  }

  $("#prevBtn").addEventListener("click", () => {
    if (state.dirty && !confirm("Discard unsaved edits and go to previous slide?")) return;
    if (state.view === "skipped") { state.view = "queue"; renderAll(); return; }
    state.current = Math.max(0, state.current - 1); state.selected = null; renderAll();
  });
  $("#nextBtn").addEventListener("click", () => {
    if (state.dirty && !confirm("Discard unsaved edits and go to next slide?")) return;
    if (state.view === "skipped") { state.view = "queue"; renderAll(); return; }
    state.current = Math.min(Math.max(0, state.queue.length - 1), state.current + 1); state.selected = null; renderAll();
  });
  $("#zoomIn").addEventListener("click", () => { state.zoom = Math.min(2.5, state.zoom + 0.25); renderImage(); const s = selectedSlide(); if (s) drawOverlay(s); });
  $("#zoomOut").addEventListener("click", () => { state.zoom = Math.max(0.5, state.zoom - 0.25); renderImage(); const s = selectedSlide(); if (s) drawOverlay(s); });
  $("#overlayToggle").addEventListener("click", () => { state.overlay = !state.overlay; $("#overlayToggle").textContent = state.overlay ? "◱ boxes" : "◱ boxes off"; drawOverlay(selectedSlide()); });
  $("#drawToggle").addEventListener("click", () => { state.drawMode = !state.drawMode; $("#drawToggle").classList.toggle("active", state.drawMode); toast(state.drawMode ? "drag a box on the image for a new figure" : "draw mode off"); });
  $("#resetBox").addEventListener("click", () => {
    const s = selectedSlide(); const f = s?.figures?.[state.selected];
    if (!s || !f) return;
    const snap = state.bboxSnap?.[state.current]?.[state.selected];
    if (!snap) return;
    f.bbox = snap.slice(); f.bbox_source = "model"; delete f.bbox_locked;
    editor.value = editorTextFor(s); state.dirty = true; renderFigureBar(s); drawOverlay(s);
  });
  $("#clearBox").addEventListener("click", () => {
    const s = selectedSlide(); const f = s?.figures?.[state.selected];
    if (!f) return;
    delete f.bbox; delete f.bbox_source; delete f.bbox_locked;
    editor.value = editorTextFor(s); state.dirty = true; renderFigureBar(s); drawOverlay(s);
  });
  $("#zoomPassBtn").addEventListener("click", async () => {
    const s = selectedSlide(); const i = state.selected;
    if (!s || i == null) return;
    const btn = $("#zoomPassBtn"); btn.disabled = true; const original = btn.textContent; btn.textContent = "zooming…";
    try {
      const { slide: updated } = await API(`/slides/${s.slide}/zoom`, { method: "POST", body: JSON.stringify({ figureIndex: i }) });
      state.result.slides[state.result.slides.findIndex((x) => x.slide === updated.slide)] = updated;
      toast(`zoom merged (figure ${i + 1})`); renderAll();
    } catch (err) { toast("zoom failed: " + err.message); } finally { btn.disabled = false; btn.textContent = original; }
  });
  $("#translateBtn").addEventListener("click", async () => {
    const s = selectedSlide();
    if (!s) return;
    const btn = $("#translateBtn"); btn.disabled = true; const original = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>translating…';
    try {
      const { slide: updated, translated, failures } = await API(`/slides/${s.slide}/translate-figures`, { method: "POST", body: JSON.stringify({}) });
      state.result.slides[state.result.slides.findIndex((x) => x.slide === updated.slide)] = updated;
      syncFromJob(await API("", {}));
      toast(`translated ${translated} field(s)${failures?.length ? ` · ${failures.length} failed` : ""}`);
      renderAll();
    } catch (err) { toast("translate failed: " + err.message); } finally { btn.disabled = false; btn.innerHTML = original; }
  });
  $("#translateAllBtn").addEventListener("click", async () => {
    const btn = $("#translateAllBtn"); btn.disabled = true; const original = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>translating…';
    try {
      const { queued, results, error } = await API("/translate-all", { method: "POST", body: JSON.stringify({}) });
      if (error) throw new Error(error);
      syncFromJob(await API("", {}));
      toast(queued ? `translated ${queued} approved slide(s)` : "nothing to translate");
      renderAll();
    } catch (err) { toast("translate all failed: " + err.message); } finally { btn.disabled = false; btn.innerHTML = original; }
  });
  $("#rerunBtn").addEventListener("click", async () => {
    const s = selectedSlide();
    if (!s) return;
    if (state.dirty && !confirm("You have unsaved edits. Save and re-run all figures/tables?")) return;
    const btn = $("#rerunBtn"); btn.disabled = true; const original = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>re-running…';
    try {
      const figureNotes = (s.figures ?? []).map((f, i) => ({ index: i, note: f.reviewer_note ?? "" })).filter((n) => String(n.note).trim());
      const slideNote = $("#missingInput").value.trim();
      const figureIndexes = state.selected != null ? [state.selected] : undefined;
      const { slide: updated } = await API(`/slides/${s.slide}/rerun`, { method: "POST", body: JSON.stringify({ slideNote, figureNotes, ...(figureIndexes ? { figureIndexes } : {}) }) });
      state.result.slides[state.result.slides.findIndex((x) => x.slide === updated.slide)] = updated;
      $("#missingInput").value = "";
      toast(`slide ${updated.slide} re-analyzed`);
      renderAll();
    } catch (err) { toast("re-run failed: " + err.message); } finally { btn.disabled = false; btn.innerHTML = original; }
  });
  $("#undoBtn").addEventListener("click", async () => {
    const s = selectedSlide(); if (!s) return;
    try {
      const { slide: restored } = await API(`/slides/${s.slide}/undo-rerun`, { method: "POST", body: "{}" });
      state.result.slides[state.result.slides.findIndex((x) => x.slide === restored.slide)] = restored;
      toast("re-run undone"); renderAll();
    } catch (err) { toast("undo failed: " + err.message); }
  });
  $("#approveBtn").addEventListener("click", async () => {
    const s = selectedSlide(); if (!s) return;
    try { await approveCurrent(); } catch (err) { toast("approve failed: " + err.message); }
  });
  $("#reopenBtn").addEventListener("click", async () => {
    const s = selectedSlide(); if (!s) return;
    try {
      const { slide: reopened } = await API(`/slides/${s.slide}/reopen`, { method: "POST", body: "{}" });
      state.statuses[s.slide] = "queued";
      state.result.slides[state.result.slides.findIndex((x) => x.slide === s.slide)] = reopened?.main ?? reopened;
      const next = await API("", {});
      syncFromJob(next);
      renderAll();
      toast("slide reopened");
    } catch (err) { toast("reopen failed: " + err.message); }
  });
  $("#exportBtn").addEventListener("click", () => {
    const s = state.result;
    if (!s?.slides?.length) { toast("nothing to export"); return; }
    const unreviewed = s.slides.filter((sl) => (state.statuses[sl.slide] ?? "queued") !== "approved" && !sl.failed).length;
    if (unreviewed > 0 && !confirm(`${unreviewed} slide(s) not yet approved. Export anyway?`)) return;
    location.href = `/api/jobs/${encodeURIComponent(jobId)}/export`;
  });
  window.addEventListener("beforeunload", (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });

  // ═════════ boot ═════════
  (async () => {
    try {
      if (!jobId) throw new Error("missing ?id=<jobId>");
      // First fetch: seed state.
      const data = await API("", {});
      syncFromJob(data);
      state.report = data.report;
      $("#fileName").textContent = data.job?.input ?? "deck";

      // Poll every 2s while the job is analyzing. Stops when we reach review/done/failed.
      const tick = async () => {
        try {
          const fresh = await API("", {});
          syncFromJob(fresh);
          state.report = fresh.report ?? state.report;
          const status = fresh.job?.status ?? "unknown";
          const pill = $("#statusPill");
          pill.textContent = status;
          pill.className = "pill " + (status === "done" ? "done" : status === "failed" ? "failed" : "review");
          const total = fresh.result?.slides?.length ?? 0;
          const done = fresh.result?.slides?.filter((s) => s?.confidence || s?.issues?.length || s?.figures?.length || s?.tables?.length).length ?? 0;
          $("#progressChip").textContent = `Analyzing ${done}/${total} slide${total === 1 ? "" : "s"}`;
          $("#slideCounter").textContent = `${done}/${total}`;
          if (fresh.job?.status === "failed") {
            $("#boot").textContent = "job failed: " + (fresh.job.error ?? "unknown error");
            $("#boot").style.color = "var(--red)";
            return; // stop polling
          }
          if ((pill.textContent === "review" || pill.textContent === "done") && !showSkippedBackup) {
            showAll();
          }
          if (fresh.job?.status !== "analyzing") { renderAll(); } else { renderRail(); renderProgress(); }
          // Global progress hairline + ETA while the deck is still processing.
          const prog = fresh.job?.progress ?? null;
          const jb = $("#jobBar");
          if (prog && (status === "analyzing" || status === "converting" || status === "queued")) {
            const stage = prog.stage ?? status;
            jb.hidden = false;
            if ((prog.total ?? 0) > 0 && stage === "analyzing") {
              jb.classList.remove("indeterminate");
              $("#jobBarFill").style.width = `${Math.min(100, Math.round((prog.done / prog.total) * 100))}%`;
              $("#progressChip").textContent = `Analyzing ${prog.done}/${prog.total} · ${prog.etaText ?? "estimating…"}`;
            } else {
              jb.classList.add("indeterminate");
              $("#jobBarFill").style.width = "0%";
              $("#progressChip").textContent = stage === "merging" ? "merging results…" : stage === "converting" ? "converting deck…" : "starting…";
            }
          } else {
            jb.hidden = true;
          }
          if (fresh.job?.status !== "analyzing" && fresh.job?.status !== "failed") return; // stop polling — entered review
        } catch (err) {
          console.warn("poll failed (continuing):", err.message);
        }
        setTimeout(tick, 2000);
      };
      let showSkippedBackup = false;
      const showAll = () => { showSkippedBackup = true; };

      // First paint: render whatever is in state already.
      show("#boot", false);
      renderAll();
      // Kick off polling if not yet done.
      if ($("#statusPill").textContent === "analyzing") setTimeout(tick, 2000);
    } catch (err) { $("#boot").textContent = "could not load job: " + err.message; }
  })();
})();
</script>
</body>
</html>
