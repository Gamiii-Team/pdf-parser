# compose.converter.yaml — optional convenience for the PPTX→PDF converter.
# The pipeline does NOT go through this file — src/input/pptxToPdf.js spawns
# `docker run --rm --network none ... pdf-parser-converter:latest` directly.
# This compose service is for manual debugging of the converter only, e.g.:
#   docker compose -f compose.converter.yaml build
#   docker compose -f compose.converter.yaml run --rm converter --headless \
#     --norestore --convert-to pdf --outdir /job /job/input.pptx
services:
  converter:
    build: ./docker/converter
    image: pdf-parser-converter:latest
    network_mode: none
    read_only: true
    user: "10001:10001"
    mem_limit: 1g             # Node enforces swap==memory at runtime via --memory-swap=1g (see pptxToPdf.js)
    pids_limit: 100
    cpus: 1.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    environment:
      HOME: /job
    working_dir: /job
    volumes:
      - ./data/convert:/job
    entrypoint: ["soffice"]
  hints:
    build:
      context: .
      dockerfile: docker/hints/Dockerfile
    image: pdf-parser-hints:latest
    network_mode: none
    read_only: true
    user: "10002"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    working_dir: /job
    volumes:
      - ./data/hints:/job:ro
    entrypoint: ["python", "/opt/pptx_hints.py"]
